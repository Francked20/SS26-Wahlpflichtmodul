version: 1

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] [%(name)s] %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default

loggers:
  uvicorn:
    handlers: [console]
    level: INFO
    propagate: no

  uvicorn.error:
    handlers: [console]
    level: INFO
    propagate: no

  uvicorn.access:
    handlers: [console]
    level: INFO
    propagate: no

root:
  handlers: [console]
  level: INFO
  